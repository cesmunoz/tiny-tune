[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "tiny-tune"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2.5"
dotenvy = "0.15"
# gpui_platform is not published independently yet, so both crates are pinned
# to the same Zed revision for reproducible builds.
gpui = { git = "https://github.com/zed-industries/zed", rev = "309f91f564fa267820e5d426daeeffafc2599530", default-features = false, features = ["font-kit", "wayland", "x11", "windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "309f91f564fa267820e5d426daeeffafc2599530", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
keyring = "=4.2.0"
secrecy = "=0.10.3"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
