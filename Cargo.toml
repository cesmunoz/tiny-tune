[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "tiny-tune"
version = "0.1.0"
edition = "2024"
publish = false

# Read by `cargo bundle` (macOS .app, Linux .deb) to set the app name and icon.
[package.metadata.bundle]
name = "Tiny Tune"
identifier = "com.tiny-tune.app"
icon = ["assets/app-icon@2x.png"]
category = "public.app-category.music"
short_description = "A smaller Spotify player"

[dependencies]
anyhow = "1"
async-channel = "2.5"
dotenvy = "0.15"
# Rune is pre-release and has no published versions, so it is pinned to a
# revision of its `dev` branch (which is never rewritten). Default features
# such as Ogg audio, SVG images and Linux D-Bus services are not needed.
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", default-features = false, features = ["accessibility", "metal-backend"] }
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
keyring = "=4.2.0"
secrecy = "=0.10.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
